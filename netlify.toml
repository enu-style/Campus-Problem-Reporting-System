# Netlify configuration for Injibara Campus Reporting System
# Frontend: React + Vite (deployed on Netlify)
# Backend: Node.js + Express (deployed separately, e.g., Render, Railway, or VPS)

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[dev]
  command = "npm run dev"
  port = 5173

# Redirects for the SPA (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for caching and security
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Environment variables required at build time
# Set these in Netlify dashboard: Site settings > Environment variables
# VITE_API_URL = https://your-backend-domain.com/api